name: Release

# bin/next_version picks major, minor, patch or no release from what the green push changed.
on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]

concurrency:
  group: release

jobs:
  tag:
    # A fork PR from a branch named main passes the branches filter, so only pushes count.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - name: Checkout the commit CI passed, with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: 3.4

      - name: Pick the next version
        id: next
        run: |
          version=$(bin/next_version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A main that moved since CI ran rejects the push. The newer commit's own run then releases both.
      - name: Bump, commit and tag
        id: bump
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          sed -i "s/VERSION = \".*\"/VERSION = \"$VERSION\"/" lib/avo/icons/version.rb
          sed -i "s/^    avo-icons (.*)$/    avo-icons ($VERSION)/" Gemfile.lock
          grep -qF "VERSION = \"$VERSION\"" lib/avo/icons/version.rb
          grep -qF "    avo-icons ($VERSION)" Gemfile.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "Bump avo-icons to v$VERSION"
          git tag --annotate "v$VERSION" --message "Bump avo-icons to v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Its own job so a failed push to rubygems.org can be re-run alone: a re-run tag job finds nothing new since the tag.
  publish:
    needs: tag
    if: needs.tag.outputs.version != ''
    runs-on: ubuntu-latest
    # rubygems.org accepts only tokens from this environment, and the environment admits only main.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      # The commit, not the tag: a tag moved after the tag job must not change what gets built.
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: 3.4

      # Built before the credentials exist, so the gemspec's Ruby never runs beside the push key.
      - name: Build the gem
        run: gem build avo-icons.gemspec

      # Trusted publishing: rubygems.org trusts this workflow file, so no API key is stored anywhere.
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@c6ca7f4bac0e29c9bde8eeae0a0a986b27efa05f # v2.2.0

      - name: Push the gem
        run: gem push "avo-icons-$VERSION.gem"
