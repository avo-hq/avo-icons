name: Update icon packs

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: # allow manual runs

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Bump icon packages to latest
        run: yarn add --ignore-scripts @tabler/icons@latest heroicons@latest

      - name: Export icons
        run: yarn export

      - name: Summarize changes
        id: summary
        run: |
          {
            echo "Automated weekly refresh of the bundled icon packs."
            echo
            echo "Package versions:"
            echo '```'
            node -p "const p=require('./package.json'); ['@tabler/icons','heroicons'].map(k=>k+': '+p.dependencies[k]).join('\n')"
            echo '```'
            echo
            echo "SVG changes (added / removed):"
            echo '```'
            git add -A lib/assets/svgs
            git diff --cached --stat -- lib/assets/svgs || true
            echo '```'
          } > /tmp/pr-body.md
          echo "added=$(git status --porcelain lib/assets/svgs | grep -c '^??' || true)" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: chore/update-icons
          title: "chore: update icon packs"
          body-path: /tmp/pr-body.md
          commit-message: "chore: update icon packs via yarn export"
          add-paths: |
            lib/assets/svgs
            package.json
            yarn.lock

      - name: Report result
        run: |
          if [ -n "${{ steps.cpr.outputs.pull-request-number }}" ]; then
            echo "### 🎨 Icon packs updated" >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.cpr.outputs.pull-request-operation }} PR [#${{ steps.cpr.outputs.pull-request-number }}](${{ steps.cpr.outputs.pull-request-url }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ No new icons" >> "$GITHUB_STEP_SUMMARY"
            echo "Icon packs are already up to date — nothing to PR." >> "$GITHUB_STEP_SUMMARY"
          fi
